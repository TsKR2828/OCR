# ============================================================
# 黑星劇場 (BLACKSTAR Theater Starless) 設定
# 純日文遊戲劇情錄製（非實況），無聊天室
# ============================================================

channel:
  name: "黒星劇場"
  game_language: ja
  default_language: ja

chat:
  enabled: false

asr:
  model_size: medium
  device: auto
  min_segment_sec: 0.5
  short_utterance_sec: 2.0
  language_confidence_threshold: 0.7

ocr:
  sample_interval_sec: 0.5
  hash_diff_threshold: 4
  stable_threshold: 2
  default_duration_sec: 4.0
  max_dialogue_duration_sec: 12.0
  # Brightness gate — 過濾無對白框的場景畫面（防止 MangaOCR 幻覺）
  # 有對白框: avg ~174-189, std ~42-52（白字+深色遮罩）
  # 無對白框: avg ~121, std ~22（純背景）
  brightness_mean_min: 150
  brightness_std_min: 35
  # 對白 ROI 文字區佔比 — 右側常有人物透出造成幻覺，只取左側文字部分
  dialogue_text_ratio: 0.65

alignment:
  overlap_ratio_threshold: 0.3
  edit_distance_consistent: 0.2
  edit_distance_readback: 0.15

highlight:
  weights:
    volume_spike: 15
    laughter: 20
    keyword_hit: 20
    chat_spike: 0
    speech_rate_change: 5
    silence_then_burst: 10
    repeated_word: 5
  top_n: 30
  min_score: 15

keywords:
  reaction: []
  story:
    - "選択肢"
    - "CG"
    - "エンディング"
    - "分岐"
    - "共通"
    - "報酬"
    - "関係値"
    - "第1話"
    - "第2話"
    - "第3話"
    - "シーズン"
    - "幕間"
    - "後日談"

