# sfx_rules.yaml — 音效自動配對規則
# 修改這個檔案來調整哪些字幕觸發哪些音效
# 規則由上到下掃描，每行字幕只配一個最高分的音效
# 用 --rules config/sfx_rules.yaml 載入

sfx_lib: "E:\\影片剪輯\\常用素材\\音效"
subtitle_style: "E:\\影片剪輯\\常用素材\\字幕樣式\\apple.prtextstyle"

density:
  min_gap_sec: 3.0
  max_per_minute: 5
  confidence_threshold: 0.3

rules:
  # ── 驚嘆/讚嘆 ──
  - sfx: "#WOW.mp3"
    name: 驚嘆
    keywords: [好厲害, 太厲害, 厲害, 好強, 太強, 好帥, 太帥, 好美, 太美,
               超猛, 天才, 太扯, 誇張, 空前絕後, 大幅提升, 佩服]
    patterns: ["好.+[啊呀哦喔]$", "也太.+了"]
    weight: 0.8

  # ── 疑問/困惑 ──
  - sfx: "What？男聲.mp3"
    name: 疑問
    keywords: [什麼, 蛤, 啥, 咦, 欸, 為什麼, 怎麼會, 不會吧, 真假, 怎麼可能,
               何關聯, 怎麼現在]
    patterns: ["[？?]{2,}", "^[蛤啥欸咦]", "怎麼.{0,6}[？?]?$"]
    weight: 0.7

  # ── 糟糕/完蛋 ──
  - sfx: "#OH NO.mp3"
    name: 糟糕
    keywords: [糟糕, 完蛋, 慘了, 不好了, 死定了, 涼了, 掰掰, 你自找的, 別怪]
    weight: 0.7

  # ── 爆炸/震驚 ──
  - sfx: "#爆炸.mp3"
    name: 爆炸驚訝
    keywords: [居然, 竟然, 嚇死, 天啊, 我的天, 傻眼, 崩潰, 不敢相信,
               死全家, 揍死, 打死]
    patterns: ["[！!]{2,}", "看我不把你", "死全家"]
    weight: 0.75

  # ── 搞笑/吐槽 ──
  - sfx: "#噗資嗯.mp3"
    name: 搞笑吐槽
    keywords: [哈哈, 笑死, 好笑, 欸不是, 什麼啦, 拜託, 有夠, 超好笑, 笑爛,
               臭八婆, 吃屎, 狗渣, 好過分, 沒禮貌, 呵呵]
    patterns: ["[哈呵]{2,}", "[wW]{2,}", "XD", "也太.+了吧"]
    weight: 0.6

  # ── 輕吐槽/無奈 ──
  - sfx: "#常用-噗03.mp3"
    name: 輕吐槽
    keywords: [呃, 唉, 好吧, 是喔, 這樣喔, 真的假的, 隨便, 算了, 誰相信, 誰信]
    weight: 0.5

  # ── 出糗/翻車 ──
  - sfx: "#綜藝叮咚嗚趴趴.mp3"
    name: 出糗
    keywords: [尷尬, 丟臉, 出糗, 失敗, 搞砸, 翻車, GG, gg, 撒謊, 被打, 又被]
    weight: 0.65

  # ── 重擊/威嚇 ──
  - sfx: "#常用-咚重擊.mp3"
    name: 重點強調
    keywords: [重點是, 注意, 就是說, 原來如此, 所以說, 結論,
               閉嘴, 給我, 我警告你, 上]
    patterns: ["^(閉嘴|給我|我警告)", "們上$"]
    weight: 0.55

  # ── 提示/轉場 ──
  - sfx: "#叮咚.mp3"
    name: 提示轉場
    keywords: [對了, 話說, 接下來, 不過, 但是, 想了一下]
    weight: 0.4

  # ── 昇天/感動 ──
  - sfx: "#天使升天聲.mp3"
    name: 昇天感動
    keywords: [好可愛, 太可愛, 可愛, 感動, 幸福, 天堂, 昇天, 戀愛, 順眼]
    weight: 0.7

  # ── 閃亮/登場 ──
  - sfx: "#閃亮亮魔法聲.mp3"
    name: 閃亮登場
    keywords: [登場, 出現, 變身, 魔法, 特別, 全新]
    weight: 0.6

  # ── 快速/動作 ──
  - sfx: "#唰.mp3"
    name: 快速動作
    keywords: [衝啊, 跑, 閃開, 瞬間, 馬上, 拖出去]
    patterns: ["^.{1,4}[！!]$"]
    weight: 0.5

  # ── 嚴肅/壓迫 ──
  - sfx: "#低沉端喔.mp3"
    name: 嚴肅壓迫
    keywords: [危險, 可怕, 恐怖, 不妙, 緊張, 殺, 賭殺]
    patterns: ["殺.{0,4}(人|此人)"]
    weight: 0.55
